<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试页面</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .test-button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>测试页面</h1>
    <p>如果您能看到这个页面，说明基本连接是正常的。</p>
    <button class="test-button" onclick="alert('按钮点击正常')">点击测试</button>
    <p>设备信息：<span id="device-info"></span></p>
    <script>
        document.getElementById('device-info').textContent = 
            `屏幕宽度: ${window.innerWidth}px, ` +
            `设备像素比: ${window.devicePixelRatio}`;
    </script>
</body>
</html>
